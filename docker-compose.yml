version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: civitrack_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: civitrack_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DB_NAME=civitrack_v2
      - JWT_SECRET=civitrack-production-jwt-secret-key-2026
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=10080
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
      - PORT=8000
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: civitrack_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
