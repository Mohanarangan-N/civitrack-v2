services:
  - type: web
    name: civitrack-v2-backend
    env: python
    rootDir: server
    buildCommand: pip install -r requirements.txt && python ../ml/train_and_eval.py
    startCommand: uvicorn app.main:socket_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: civitrack_v2
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        value: "*"
